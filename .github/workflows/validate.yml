name: Validate registry

on:
  pull_request:
    paths:
      - '*.registry.json'
      - 'schemas/**'
      - '.github/workflows/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g ajv-cli@5.0.0
      - run: ajv validate -s schemas/themes.schema.json -d themes.registry.json
      - run: ajv validate -s schemas/extensions.schema.json -d extensions.registry.json
      - run: ajv validate -s schemas/plugins.schema.json -d plugins.registry.json
