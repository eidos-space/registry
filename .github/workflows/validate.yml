name: Validate registry

on:
  pull_request:
    paths:
      - '*.registry.json'
      - 'schemas/**'
      - '.github/workflows/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g ajv-cli@5.0.0
      - run: ajv validate -s schemas/extensions.schema.json -d extensions.registry.json
      - run: ajv validate -s schemas/plugins.schema.json -d plugins.registry.json
      - run: ajv validate -s schemas/plugins.schema.json -d tests/theme-plugin.registry.json
      - run: |
          if ajv validate -s schemas/plugins.schema.json -d tests/invalid-theme-kind.registry.json; then
            echo 'A theme category without kind: theme must be rejected'
            exit 1
          fi
          if ajv validate -s schemas/plugins.schema.json -d tests/invalid-theme-category.registry.json; then
            echo 'A theme kind outside the themes category must be rejected'
            exit 1
          fi
